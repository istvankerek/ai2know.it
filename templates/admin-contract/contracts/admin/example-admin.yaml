openapi: "3.1.0"
info:
  title: AI Bootcamp Admin API
  version: "1.0.0"
  description: |
    Az aibos.space konzol által hívott admin REST API (contract-first sablon).

    **Hitelesítés.** Minden `/api/admin/v1/*` kérésen:
    - `Authorization: Bearer <workload_jwt>` — aibos M2M workload token
    - `X-Actor-Assertion: <jws>` — JWS kompakt, `typ=aibos-actor+jwt`
      (EdDSA/Ed25519, max 120 s élettartam, request binding)

    **Jogosultság.** Minden operáción `x-permission` mező jelöli a szükséges
    permission kódot (rövidített, projekt prefix nélkül). A teljes kód:
    `aibootcamp.{modul}.{akció}` — a `contracts/authorization/permissions.json`
    az autoritatív forrás.

    **Lapozás.** Minden lista cursoros: `?cursor=&limit=` (1–100, alap 25),
    sorrend `createdAt DESC`. Válasz: `{data, nextCursor?}` — a `nextCursor`
    hiánya az utolsó lapot jelzi. A cursor átlátszatlan; érvénytelen cursor
    `422 Unprocessable Entity`.

    **Hibák.** RFC 7807 `application/problem+json`, type URI prefix:
    `https://aibos.space/errors/<slug>`.

    **Idempotencia.** Minden mutáción ajánlott az `Idempotency-Key` header;
    scope: `(tenant, principal, key)`, TTL: 24 h.

servers:
  - url: http://localhost:8081
    description: Helyi fejlesztés

security:
  - workloadJwt: []
    actorAssertion: []

tags:
  - name: health
    description: Liveness és readiness
  - name: courses
    description: Kurzusok kezelése
  - name: students
    description: Diákok és haladásuk

paths:
  /health/live:
    get:
      tags: [health]
      operationId: healthLive
      summary: Él-e a folyamat
      security: []
      responses:
        "200":
          description: ok
          content:
            text/plain:
              schema:
                type: string
                const: ok

  /health/ready:
    get:
      tags: [health]
      operationId: healthReady
      summary: Elérhető-e az adatbázis
      security: []
      responses:
        "200":
          description: kész
        "503":
          description: az adatbázis nem érhető el
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  # ── Kurzusok ───────────────────────────────────────────────────────────────

  /api/admin/v1/courses:
    get:
      tags: [courses]
      operationId: listCourses
      summary: Kurzusok listája (cursoros lapozás)
      x-permission: courses.list
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CourseStatus"
      responses:
        "200":
          description: Kurzus lista lap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    post:
      tags: [courses]
      operationId: createCourse
      summary: Kurzus létrehozása
      description: |
        Új kurzust hoz létre `draft` státusszal. A `slug` egyedinek kell
        lennie a projektben; ütközés esetén `409 Conflict`.
      x-permission: courses.create
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Létrehozva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/admin/v1/courses/{id}:
    parameters:
      - $ref: "#/components/parameters/CourseId"

    get:
      tags: [courses]
      operationId: getCourse
      summary: Kurzus részletei
      x-permission: courses.view
      responses:
        "200":
          description: Kurzus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [courses]
      operationId: updateCourse
      summary: Kurzus részleges módosítása
      description: |
        Hiányzó kulcs nem változtat, `null` törli a nullázható mezőt.
        Státuszt itt nem lehet változtatni — arra a `/publish` és `/archive`
        végpontok valók.
      x-permission: courses.edit
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoursePatch"
      responses:
        "200":
          description: Módosítva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      tags: [courses]
      operationId: deleteCourse
      summary: Kurzus soft törlése
      description: |
        Soft delete: `is_deleted = true`, fizikai törlés nem történik.
        Kötelező indoklás az actor assertion `reason` mezőjében.
      x-permission: courses.delete
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Törölve
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/admin/v1/courses/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/CourseId"

    post:
      tags: [courses]
      operationId: publishCourse
      summary: Kurzus publikálása
      description: |
        `draft` → `published` állapotváltás. Visszavonhatatlan az `/archive`
        végpontig. High-risk: az actor assertionben `aal=aal2` szükséges.
      x-permission: courses.publish
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Publikálva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/admin/v1/courses/{id}/history:
    parameters:
      - $ref: "#/components/parameters/CourseId"

    get:
      tags: [courses]
      operationId: getCourseHistory
      summary: Kurzus auditnapló
      x-permission: courses.history
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Auditnapló lap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Diákok ─────────────────────────────────────────────────────────────────

  /api/admin/v1/students:
    get:
      tags: [students]
      operationId: listStudents
      summary: Diákok listája (cursoros lapozás)
      x-permission: students.list
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Diák lista lap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/admin/v1/students/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [students]
      operationId: getStudent
      summary: Diák részletei és haladása
      x-permission: students.view
      responses:
        "200":
          description: Diák
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

# ── Components ─────────────────────────────────────────────────────────────────

components:
  securitySchemes:
    workloadJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        aibos M2M workload token. Kiadó: `https://aibos.space`. Scope-ok a
        szükséges permission kódokhoz igazodnak.
    actorAssertion:
      type: apiKey
      in: header
      name: X-Actor-Assertion
      description: |
        JWS kompakt token (`typ=aibos-actor+jwt`, EdDSA/Ed25519).
        Tartalmazza: operator sub, tenant, scope-ok, request binding (method,
        path, body SHA-256). Élettartam: max 120 másodperc.

  parameters:
    CourseId:
      name: id
      in: path
      required: true
      description: Kurzus UUID azonosítója
      schema:
        type: string
        format: uuid

    Cursor:
      name: cursor
      in: query
      description: Átlátszatlan lapozó kurzor (előző válasz nextCursor értéke)
      schema:
        type: string

    Limit:
      name: limit
      in: query
      description: Egy lap mérete (1–100, alapértelmezés 25)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    Search:
      name: search
      in: query
      description: Szabad szöveges keresés
      schema:
        type: string
        maxLength: 200

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: UUIDv4 az idempotens újraküldéshez (scope tenant+principal, TTL 24 h)
      schema:
        type: string
        format: uuid

    IfMatch:
      name: If-Match
      in: header
      description: |
        Optimista zárolás: `W/"<version>"` — hiányzó esetén `428`,
        elavult esetén `412`.
      schema:
        type: string

  schemas:
    Problem:
      type: object
      description: RFC 7807 problem detail
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: "URI prefix: https://aibos.space/errors/<slug>"
          example: "https://aibos.space/errors/not-found"
        title:
          type: string
          description: Rövid, ember-olvasható leírás
          example: "Nem található"
        status:
          type: integer
          description: HTTP státuszkód
          example: 404
        detail:
          type: string
          description: Részletes, user-safe leírás (nincs belső adat)
        instance:
          type: string
          format: uri-reference
          description: A kérés path-je
          example: "/api/admin/v1/courses/uuid"
        correlation_id:
          type: string
          format: uuid

    CourseStatus:
      type: string
      enum: [draft, published, archived]

    Course:
      type: object
      required: [id, slug, title, status, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          minLength: 2
          maxLength: 100
          pattern: "^[a-z0-9-]+$"
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          nullable: true
        status:
          $ref: "#/components/schemas/CourseStatus"
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: string
          description: "Optimista zároláshoz: W/\"1\""

    CourseList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Course"
        nextCursor:
          type: string
          description: Ha hiányzik, ez az utolsó lap

    CourseInput:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
          minLength: 2
          maxLength: 100
          pattern: "^[a-z0-9-]+$"
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000

    CoursePatch:
      type: object
      description: Részleges módosítás — hiányzó kulcs nem változtat
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          nullable: true

    AuditEntry:
      type: object
      required: [id, ts, operatorId, permission, httpMethod, path, entityType, entityId, outcome]
      properties:
        id:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        operatorId:
          type: string
        permission:
          type: string
        httpMethod:
          type: string
        path:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        reason:
          type: string
          nullable: true
        ticket:
          type: string
          nullable: true
        outcome:
          type: string
          enum: [success, denied, error]

    AuditEntryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        nextCursor:
          type: string

    Student:
      type: object
      required: [id, skillpassSub, enrolledAt]
      properties:
        id:
          type: string
          format: uuid
        skillpassSub:
          type: string
          description: SkillPass identity subject
        enrolledAt:
          type: string
          format: date-time
        completedCourseCount:
          type: integer
          minimum: 0

    StudentList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Student"
        nextCursor:
          type: string

  responses:
    Unauthenticated:
      description: Hiányzó vagy érvénytelen hitelesítés
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://aibos.space/errors/missing-workload-token"
            title: "Hitelesítés szükséges"
            status: 401

    Forbidden:
      description: Nincs jogosultság
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://aibos.space/errors/insufficient-scope"
            title: "Nincs jogosultság"
            status: 403

    NotFound:
      description: Az erőforrás nem található
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://aibos.space/errors/not-found"
            title: "Nem található"
            status: 404

    Conflict:
      description: Ütközés (pl. slug duplikátum)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://aibos.space/errors/conflict"
            title: "Ütközés"
            status: 409

    PreconditionFailed:
      description: Elavult If-Match érték
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://aibos.space/errors/precondition-failed"
            title: "Elavult verzió"
            status: 412

    UnprocessableEntity:
      description: Validációs hiba
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://aibos.space/errors/validation"
            title: "Validációs hiba"
            status: 422
