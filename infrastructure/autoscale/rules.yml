# Worker auto-scale szabalyok
rules:
  - worker_type: default
    min_replicas: 1
    max_replicas: 5
    scale_up:
      queue_depth_threshold: 100
      cooldown: 60s
    scale_down:
      queue_depth_threshold: 10
      cooldown: 300s

  - worker_type: email
    min_replicas: 1
    max_replicas: 3
    scale_up:
      queue_depth_threshold: 50

  - worker_type: ai-tasks
    min_replicas: 1
    max_replicas: 2
    scale_up:
      queue_depth_threshold: 20
    cost_limit_hourly: 50

  - worker_type: scraper
    min_replicas: 0
    max_replicas: 3
    scale_up:
      queue_depth_threshold: 10

  - worker_type: spider
    min_replicas: 0
    max_replicas: 2
    scale_up:
      queue_depth_threshold: 5
