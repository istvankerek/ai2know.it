# AIOS orchestrator routing policy (v8.0, plan-v15 F2)
#
# Egyetlen igazsagforras: melyik CLI / modell / effort kapja a feladatot.
# Ember-olvashato nezet: .aios-cli/core/routing-policy.md (python3 -m aios policy-doc).
# Modell felulirasa: AIOS_MODEL_<PROVIDER>_<VARIANT> env, pl. AIOS_MODEL_CLAUDE_CRITICAL.
# Helyi URL felulirasa: AIOS_LOCAL_MLX_URL / AIOS_LOCAL_LMSTUDIO_URL / AIOS_LOCAL_LLAMACPP_URL.

version = 1
default_tier = "STANDARD"
default_data_class = "internal"
# ~200K token felett nagy kontextus (kb. 4 byte / token)
large_context_bytes = 800000

[breaker]
failures = 3
cooldown_s = 600

# ------------------------------------------------------------------
# Providerek
# data_classes: milyen adatosztalyt kaphat. sensitive = PII, secret, ugyfeladat,
# jogi tervezet -> csak helyi modell vagy Claude (P-V15-04).
# ------------------------------------------------------------------

[providers.claude]
kind = "cli"
binary = "claude"
data_classes = ["public", "internal", "sensitive"]
timeout_s = 1800

[providers.claude.variants]
plan       = { model = "claude-fable-5-1",           effort = "high" }
critical   = { model = "claude-opus-5-5",            effort = "max" }
standard   = { model = "claude-sonnet-5-5",          effort = "high" }
review     = { model = "claude-sonnet-5-5",          effort = "high" }
mechanical = { model = "claude-haiku-4-5-20251001",  effort = "low" }

[providers.codex]
kind = "cli"
binary = "codex"
data_classes = ["public", "internal"]
timeout_s = 1800

[providers.codex.variants]
fast     = { model = "gpt-5.3-codex-spark", effort = "low",    profile = "fast" }
balanced = { model = "gpt-5.3-codex",       effort = "medium", profile = "balanced" }
deep     = { model = "gpt-5.5",             effort = "xhigh",  profile = "deep" }

[providers.gemini]
kind = "cli"
binary = "gemini"
data_classes = ["public", "internal"]
timeout_s = 1800

[providers.gemini.variants]
# "auto": a gemini CLI sajat alapertelmezett modellje (AIOS_MODEL_GEMINI_DEFAULT feluliras)
default = { model = "auto", effort = "default" }

[providers.mlx]
kind = "local"
url = "http://127.0.0.1:8080/v1"
url_env = "AIOS_LOCAL_MLX_URL"
data_classes = ["public", "internal", "sensitive"]
timeout_s = 300

[providers.mlx.variants]
default = { model = "default", effort = "low" }

[providers.lmstudio]
kind = "local"
url = "http://127.0.0.1:1234/v1"
url_env = "AIOS_LOCAL_LMSTUDIO_URL"
data_classes = ["public", "internal", "sensitive"]
timeout_s = 300

[providers.lmstudio.variants]
default = { model = "default", effort = "low" }

[providers.llamacpp]
kind = "local"
url = "http://127.0.0.1:8081/v1"
url_env = "AIOS_LOCAL_LLAMACPP_URL"
data_classes = ["public", "internal", "sensitive"]
timeout_s = 300

[providers.llamacpp.variants]
default = { model = "default", effort = "low" }

# ------------------------------------------------------------------
# Tier-ek: lanc = "provider:variant" sorrendben (elso = elsodleges)
# ------------------------------------------------------------------

[tiers.PLAN]
description = "Architektura, plan-vN, ADR, rendszertervezes"
chain = ["claude:plan", "claude:critical", "codex:deep"]

[tiers.CRITICAL]
description = "Security, prod, migracio, adatvesztes, breaking change"
chain = ["claude:critical", "codex:deep"]
requires_confirm = true

[tiers.STANDARD]
description = "Feature, bug fix, refactor, atlagos modositas"
chain = ["claude:standard", "codex:balanced", "claude:critical"]

[tiers.REVIEW]
description = "Kod review, PR atnezes"
chain = ["claude:review", "codex:deep"]

[tiers.SCOPED]
description = "Jol korulhatarolt implementacio, boilerplate, batch, tesztgeneralas"
chain = ["codex:balanced", "claude:standard"]

[tiers.LARGE_CONTEXT]
description = "Nagy kontextus (>200K token), teljes repo audit, web kutatas"
chain = ["gemini:default", "claude:standard"]

[tiers.MECHANICAL]
description = "Formazas, atnevezes, regex, osztalyozas, egyszeru lookup"
chain = ["mlx:default", "lmstudio:default", "llamacpp:default", "claude:mechanical", "codex:fast"]

[tiers.CONSENSUS]
description = "Kritikus dontes: Claude + Codex + Gemini parhuzamosan (scripts/multi-vendor-consensus.sh)"
chain = ["claude:critical", "codex:deep", "gemini:default"]
parallel = true

# ------------------------------------------------------------------
# Osztalyozo szabalyok. Sorrend = prioritas (elso talalat nyer).
# A kulcsszavak ekezet nelkul, kisbetuvel; a szoveget is igy normalizaljuk.
# Illesztes: szo elejen kezdodo prefix (magyar ragozas miatt); zaro szokoz = egesz szo.
# ------------------------------------------------------------------

[[rules]]
tier = "CONSENSUS"
keywords = ["konszenzus", "consensus", "multi-vendor", "3 cli", "harom cli"]

[[rules]]
tier = "CRITICAL"
keywords = ["prod ", "prod-", "production", "eles ", "migracio", "migration", "security audit", "biztonsagi audit",
            "adatvesztes", "data loss", "adatbazis torles", "fizikai torles", "torold", "torolj", "rm -rf", "drop table", "breaking change", "rollback",
            "titok rotacio", "secret rotation", "vulnerability", "sebezhetoseg"]

[[rules]]
tier = "PLAN"
keywords = ["architektura", "architecture", "tervezd", "terv ", "plan-v", "plan ", "adr", "rendszerterv",
            "design doc", "specifikacio"]

[[rules]]
tier = "REVIEW"
keywords = ["review", "nezd at", "atnezes", "ellenorizd a pr", "pr-t", "code review", "kod review"]

[[rules]]
tier = "LARGE_CONTEXT"
keywords = ["web kutatas", "web research", "kutasd", "research", "teljes kodbazis", "egesz repo",
            "whole codebase", "osszes projekt", "200k"]

[[rules]]
tier = "MECHANICAL"
keywords = ["nevezd at", "atnevez", "rename", "formazd", "formazas", "prettier", "regex", "import rendez", "typo",
            "elgepeles", "lint fix", "osztalyozd", "classify", "sort imports"]

[[rules]]
tier = "SCOPED"
keywords = ["boilerplate", "scaffold", "crud", "generalj teszt", "unit teszt generalas", "batch",
            "tomeges", "endpointot", "dto"]

[data_classes.sensitive]
keywords = ["szemelyes adat", "pii", "gdpr", "ugyfel email", "ugyfeladat", "ugyfel adat", "customer data",
            "email lista", "jelszo", "password", "secret", "titok", "access token", "refresh token", "api kulcs", "api key",
            "bankszamla", "szamla adat", "jogi tervezet", "aszf tervezet", "egeszsegugyi", "telefonszam"]
file_patterns = [".env", ".env.*", "*.pem", "*.key", "*.p12", "secrets/*", "*customers*", "*.dump", "*backup*.sql"]

[data_classes.public]
keywords = ["publikus", "open source", "nyilvanos dokumentacio"]
