[package]
name = "{{project-name}}-ai-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
qdrant-client = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"

[[bin]]
name = "ai-chat"
path = "src/main.rs"
